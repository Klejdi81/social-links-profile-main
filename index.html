<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Social links profile</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      @font-face {
        font-family: "Inter";
        src: url("./fonts/Inter-VariableFont_slnt,wght.ttf") format("truetype");
        font-weight: 100 900;
        font-style: normal;
      }

      body {
        font-family: "Inter", sans-serif;
        background-color: hsl(0, 0%, 8%);
        display: flex;
        height: 100vh;
        align-items: center;
        justify-content: center;
        color: white;
      }

      main {
        background-color: hsl(0, 0%, 12%);
        padding: 2.4rem 1.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 300px;
      }

      .profile-section {
        text-align: center;
      }

      main .profile-section img {
        border-radius: 50%;
        width: 70px;
      }

      .profile-section h3 {
        font-size: 1.5rem;
        margin-bottom: 0;
      }

      .profile-section h6 {
        color: hsl(75, 94%, 57%);
        font-size: 14px;
        margin-top: 10px;
      }

      .profile-section .bio p {
        font-size: 13px;
      }

      article {
        width: 100%;

        text-align: center;
      }

      .link-list {
        list-style-type: none;

        padding: 0;
      }

      .link-list > li {
        background-color: hsl(0, 0%, 20%);
        margin-bottom: 1rem;
        width: 100%;
        text-align: center;
        border-radius: 7px;
        padding: 0.5rem 0;
      }

      .link-list li:hover {
        cursor: pointer;
        background-color: hsl(75, 94%, 57%);
        color: black;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="profile-section">
        <img src="assets/images/avatar-jessica.jpeg" alt="" />
        <h3>Jessica Randall</h3>
        <h6>London,United Kingdom</h6>
        <div class="bio">
          <p>"Front-end developer and avid reader."</p>
        </div>
      </section>

      <article>
        <ul class="link-list">
          <li>Github</li>
          <li>Frontend Mentor</li>
          <li>Linkedin</li>
          <li>Twitter</li>
          <li>Instagram</li>
        </ul>
      </article>
    </main>
  </body>
</html>
